; Pasta unica para PlatformIO, Arduino IDE, Wokwi (VS Code) e Wokwi Web.
[platformio]
src_dir = .
default_envs = wokwi

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; Simulador: buffer em RAM + Monitor Serial
[env:wokwi]

; Chip real: acrescenta o diario em SPIFFS, que sobrevive a queda de energia
[env:esp32-real]
build_flags = -DCARDIOIA_USE_SPIFFS=1
